interface:
  display_name: "Spine动画"
  short_description: "单张或 20–30 张文件夹批量立绘转 8 秒 Spine 4.2 待机动画：默认优先 Mivo Canvas 拆层补全（原画 PSD 独立层 4K 无损直取，Canvas 异常自动本机兜底）、批量锁定防误改、默认按火炬官网同款 60 帧双档导出透明网页视频"
  default_prompt: "将这张立绘（或指定文件夹内的全部立绘）做成 8 秒 Spine 4.2 动态待机预览：默认品质优先，扁平图与合并主体层优先走 Mivo Canvas 拆层与 AI 补全（多层原画 PSD 已独立分层部位 4K 无损直取；Canvas 不可用或出错时自动降级本机兜底），直出 Studio 实时预览/批量验收台，支持锁定防误改、打回集中返修与默认官网同款 60 帧双档（PC + 手机预乘 H.264 + 无损 poster.webp + media.json）统一导出。"
policy:
  allow_implicit_invocation: true
